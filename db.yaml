- name: configure database
  hosts: db
  bacome: yes
  vars:
   login_host: db.lukalapu.online
  vars_prompt:
   - name: mysql_root_password
     prompt: Please enter your password
     private: false
  
  tasks:
   - name: install mysql server
     ansible.builtin.dnf:
      name: mysql-server
      state: installed

   - name: enable and start the mysql sever
     ansible.builtin.service:
      name: mysql-server
      state: started
      enabled: yes
 
   - name: Install python dependencies
     ansible.builtin.pip:
      name:
       - PyMySQL  # Install the latest verison
       - cryptography # required for password handling
      executable: pip3.9.25 # set avsaed on the latest ansible version by checking ansible --verison

   - name: verify database
     community.mysql.mysql_info:
      login_user: root
      login_host: "{{ login_host }}
      login_password: "{{ mysql_root_password }}"
      filter: version
     ignore_errors: yes
     register: mysql_connection

   - name: set up root for password if connection fails
     ansible.builtin.command: "mysql_secure_installation --set-root=pass {{ mysql_root_password }}"
     when: mysql_connection.failed is true


       




   
